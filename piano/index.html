<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F6F3EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161C" media="(prefers-color-scheme: dark)">
<title>Grace 练琴</title>
<meta name="description" content="Grace 的每日练琴看板：赞美诗与世界名曲、分手跟谱练、听音评分、识谱、录音。">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grace 练琴">
<link rel="apple-touch-icon" sizes="180x180" href="icon-v2.png">
<link rel="icon" href="icon-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* 版式：琴谱纸 + 深酒红强调色；乐谱区始终是白纸，方便看谱 */
:root{
  --paper:#F6F3EC; --card:#FFFFFF; --ink:#22201C; --muted:#6B665D; --line:#E2DCD0;
  --accent:#7A2E3A; --accent-ink:#FFFFFF; --accent-soft:#F3E4E4; --gold:#A67C1E;
  --ok:#2F7A4F; --ok-soft:#E3F1E8; --bad:#C2412D; --bad-soft:#FBE7E2; --hear:#3A6FB0;
  --sheet:#FFFDF8; --sheet-ink:#1D1B18;
  --f-head:"Noto Serif SC","Songti SC","STSong",serif;
  --f-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14161C; --card:#1D2028; --ink:#ECE7DD; --muted:#A39D92; --line:#2E323C;
  --accent:#E59AA5; --accent-ink:#1D1015; --accent-soft:#3A2228; --gold:#D9B45E;
  --ok:#7CCB9C; --ok-soft:#1C3326; --bad:#F08C78; --bad-soft:#3A221D; --hear:#8DB6EA; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14161C; --card:#1D2028; --ink:#ECE7DD; --muted:#A39D92; --line:#2E323C;
  --accent:#E59AA5; --accent-ink:#1D1015; --accent-soft:#3A2228; --gold:#D9B45E;
  --ok:#7CCB9C; --ok-soft:#1C3326; --bad:#F08C78; --bad-soft:#3A221D; --hear:#8DB6EA; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);margin:0}
body{color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-head);font-weight:700;margin:0;text-wrap:balance}
.wrap{max-width:1000px;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom))}
.muted{color:var(--muted)} .small{font-size:.86rem}
.eyebrow{font-size:.78rem;letter-spacing:.06em;color:var(--muted);margin:0 0 2px}
.hero{padding:18px 0 8px} .hero h1{font-size:2rem} .hero .sub{margin:.3rem 0 0;color:var(--muted)}
.pagehead{padding:10px 0 6px} .pagehead h1{font-size:1.6rem} .pagehead p{margin:.3rem 0 0}
.back{display:inline-block;text-decoration:none;font-size:.95rem;margin-bottom:4px;padding:6px 0}
.en{color:var(--muted);margin:2px 0 0;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.h2{font-size:1.1rem;margin-bottom:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:0 12px;font-size:.9rem}
.btn.rec.on{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stats b{display:block;font-size:1.6rem;font-family:var(--f-head);font-variant-numeric:tabular-nums}
.stats span{font-size:.8rem;color:var(--muted)}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:10px}
@media (min-width:760px){.steps{grid-template-columns:1fr 1fr}}
.step{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.step .num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700}
.step.done .num{background:var(--ok-soft);color:var(--ok)}
.step h3{font-size:1.1rem;margin:2px 0} .step p{margin:.2rem 0 .7rem}
.cal{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;max-width:520px}
.cal i{aspect-ratio:1;border-radius:4px;background:var(--line)}
.cal i.c1{background:color-mix(in srgb,var(--ok) 35%,var(--line))} .cal i.c2{background:color-mix(in srgb,var(--ok) 60%,var(--line))}
.cal i.c3,.cal i.c4{background:var(--ok)} .cal i.t{outline:2px solid var(--accent);outline-offset:1px}
.foot{text-align:center;margin:20px 0}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin:10px 0;overflow-x:auto}
.seg button{flex:1;min-height:40px;border-radius:9px;padding:0 10px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:disabled{opacity:.35}
.seg.small button{min-height:38px}
.songs{display:grid;gap:10px}
@media (min-width:700px){.songs{grid-template-columns:1fr 1fr}}
.song{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-decoration:none;color:var(--ink)}
.song h3{font-size:1.15rem;margin-top:6px}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lv{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--ok-soft);color:var(--ok)}
.lv2{background:#F5ECD8;color:#8A6414} .lv3{background:var(--accent-soft);color:var(--accent)} .lv4{background:var(--accent);color:var(--accent-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lv2{background:#2B2617;color:#D9B45E}}
.tag{font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--accent);color:var(--accent-ink)}
.hbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:.8rem;color:var(--muted)}
.st{color:var(--line);font-size:.9em} .st.on{color:var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0;font-size:.82rem}
.chips span{padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chips .lv{border:0}
.tip{background:var(--card);border-left:4px solid var(--gold);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.95rem}
.tip .src{display:block;margin-top:6px;font-size:.78rem;color:var(--muted)}
.ctl{display:grid;gap:0} @media (min-width:700px){.ctl{grid-template-columns:1fr 1fr;gap:10px}}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 8px}
.bar .hint{flex-basis:100%;margin:2px 0 0;font-size:.85rem;color:var(--muted)}
.speed{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--muted)}
.speed input{width:110px;accent-color:var(--accent)} .speed output{min-width:3em;font-variant-numeric:tabular-nums;color:var(--ink)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;min-height:40px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.live{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:1rem;position:sticky;top:6px;z-index:5}
.live b{font-size:1.2rem} .bad-t{color:var(--bad);font-weight:700}
.score{background:var(--sheet);color:var(--sheet-ink);border:1px solid var(--line);border-radius:14px;padding:8px 4px;margin:8px 0;overflow:hidden;min-height:120px}
.score svg{display:block;max-width:100%}
.score.small{min-height:0;padding:4px} .score.quiz{max-width:360px;margin:10px auto;min-height:0}
.score .abcjs-note,.score .abcjs-rest{cursor:pointer}
.score .cur path,.score .cur{fill:#C2412D!important;color:#C2412D}
.score .target path{fill:#F08C00!important} .score .target{filter:drop-shadow(0 0 4px rgba(240,140,0,.9))}
.score .ok path{fill:#1E9E4A!important} .score .bad path,.score .miss path{fill:#D93025!important}
.score .from path{fill:#A67C1E!important}
.kbwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0;border-radius:10px;scrollbar-width:thin}
.kb{display:block}
.kb .kw{fill:#FFFFFF;stroke:#B9B2A5} .kb .kb-b{fill:#26231F}
.kb .kl{font-size:9px;fill:#857E72;text-anchor:middle;font-family:var(--f-ui)} .kb .kl2{fill:#B3AC9F}
/* 键盘颜色：橙色 = 该弹；绿色 = 弹对（闪一下）；红色 = 弹错（闪一下） */
.kb rect.tgt{fill:#FF9F0A;stroke:#C77700;stroke-width:2} .kb rect.kb-b.tgt{fill:#F08C00}
.kb rect.okk{fill:#34C759;stroke:#1E8E3E;stroke-width:2} .kb rect.kb-b.okk{fill:#1E9E4A}
.kb rect.wrong{fill:#FF3B30;stroke:#B3261E;stroke-width:2} .kb rect.kb-b.wrong{fill:#D93025}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88rem;color:var(--muted);margin:2px 0 8px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.lg-t{background:#FF9F0A} .lg-ok{background:#34C759} .lg-bad{background:#FF3B30}
.opts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:8px 0}
.opts select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:40px;padding:0 8px}
.result{background:var(--card);border:2px solid var(--accent);border-radius:18px;padding:18px;margin:12px 0;text-align:center}
.result .big{font-family:var(--f-head);font-size:3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.result .big small{font-size:1rem;margin-left:4px}
.result .stars{font-size:1.8rem;margin:4px 0} .result p{margin:.4rem 0} .praise{font-weight:600}
.recs{display:grid;gap:8px}
.rec{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px}
.rec:first-child{border-top:0;padding-top:0}
.rt{display:flex;flex-direction:column} .ra{display:flex;gap:6px}
.quizlist{display:grid;gap:8px} @media (min-width:700px){.quizlist{grid-template-columns:1fr 1fr 1fr}}
.qz{display:flex;flex-direction:column;gap:2px;padding:12px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink)}
.qz.rec{border-color:var(--accent);background:var(--accent-soft)}
.lessons{padding-left:1.4rem;margin:0} .lessons li{margin:6px 0} .lessons a{text-decoration:none;font-weight:600}
.lesson p{margin:.5rem 0}
.pager{display:flex;justify-content:space-between;gap:10px;margin:10px 0}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.qfb{text-align:center;font-size:1.05rem;min-height:3em;margin:6px 0}
.qfb.good{color:var(--ok);font-weight:600} .qfb.badq{color:var(--bad)}
.answers{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:560px;margin:0 auto}
.answers button{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:64px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.answers b{font-size:1.4rem} .answers span{font-size:.75rem;color:var(--muted)}
.answers .right{background:var(--ok-soft);border-color:var(--ok)} .answers .wrongb{background:var(--bad-soft);border-color:var(--bad)}
.tuner{display:flex;align-items:baseline;gap:10px;margin:12px 0;flex-wrap:wrap}
.tuner b{font-size:2.4rem;font-family:var(--f-head);min-width:3ch}
.meter{flex-basis:100%;height:8px;background:var(--line);border-radius:4px;overflow:hidden} .meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .1s}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{flex:1;max-width:180px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;text-decoration:none;color:var(--muted);font-size:.78rem;font-weight:600}
.tabbar a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar a.on{color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:.92rem;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#update{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:40;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:8px 16px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.2)}
#michelp{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
#michelp[hidden]{display:none}
.mh-card{background:var(--card);color:var(--ink);border-radius:18px;padding:20px;max-width:520px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.mh-card h2{font-size:1.2rem;margin-bottom:6px} .mh-card ol{padding-left:1.3rem;margin:10px 0} .mh-card li{margin:8px 0}
.mh-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.inapp{position:sticky;top:0;z-index:45;background:var(--bad);color:#fff;padding:10px 16px;font-size:.95rem;text-align:center}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="wrap" id="main"><p class="loading">正在打开琴谱……</p></main>
<nav class="tabbar" aria-label="主导航">
  <a href="#/today" data-tab="today"><svg viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg>今天</a>
  <a href="#/library" data-tab="library"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>曲库</a>
  <a href="#/read" data-tab="read"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 10h18M3 14h18M3 18h18"/><ellipse cx="9" cy="16" rx="2.2" ry="1.6" fill="currentColor"/></svg>识谱</a>
  <a href="#/recs" data-tab="recs"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>录音</a>
</nav>
<button id="update" hidden>看板已更新，点这里刷新</button>
<div id="toast" role="status" aria-live="polite"></div>
<script src="vendor/abcjs-basic-min.js"></script>
<script>
// 先读 version.json（不走缓存），再按版本号加载曲库和程序，保证 Kevin 改完后这边拿到最新内容
(function () {
  function load(v) {
    window.PIANO_VERSION = v || "dev";
    var q = v ? "?v=" + encodeURIComponent(v) : "";
    ["music.js", "data.js", "app.js"].reduce(function (p, src) {
      return p.then(function () { return new Promise(function (res, rej) { var s = document.createElement("script"); s.src = src + q; s.onload = res; s.onerror = rej; document.body.appendChild(s); }); });
    }, Promise.resolve()).catch(function () { document.getElementById("main").innerHTML = '<p class="loading">加载失败，请检查网络后刷新。</p>'; });
  }
  fetch("version.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.json(); })
    .then(function (j) { load(j && j.v); }).catch(function () { load(null); });
})();
</script>
</body>
</html>
