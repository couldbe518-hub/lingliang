<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161A" media="(prefers-color-scheme: dark)">
<title>Grace 拉伸</title>
<meta name="description" content="Grace 的每日拉伸与球场教练：物理治疗思路的全身拉伸、普拉提要领、语音指导与背景音乐、羽毛球网球热身与动作分析。">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Grace 拉伸">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
/* 版式：暖沙色底 + 深青主色 + 赤陶色标注拉伸部位；睡前计划切换成夜色 */
:root{
  --bg:#F4F1EA; --card:#FFFFFF; --ink:#1C2627; --muted:#687271; --line:#E4DED2; --soft:#ECE7DC;
  --accent:#2C6A64; --accent-ink:#FFFFFF; --accent-soft:#DCEBE7; --hl:#E07A5F; --hl-soft:#F8E1D9;
  --gold:#C29A3E; --ok:#2F7A4F; --ok-soft:#E1F0E6; --bad:#C2412D; --bad-soft:#FBE7E2;
  --fig:#2C5457; --fig-far:#A9C2BF; --fig-hair:#1A3436; --prop:#CFC6B6; --mat:#DCD5C7;
  --shadow:0 1px 2px rgba(28,38,39,.05),0 6px 20px rgba(28,38,39,.06);
  --f-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,sans-serif;
  --r:20px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161A; --card:#192126; --ink:#E9EEEC; --muted:#93A09E; --line:#28333A; --soft:#1F2A30;
  --accent:#7CC5BA; --accent-ink:#0D1F1C; --accent-soft:#1D3633; --hl:#F29A80; --hl-soft:#3A2620;
  --gold:#DDB960; --ok:#7CCB9C; --ok-soft:#1B3326; --bad:#F08C78; --bad-soft:#3A221D;
  --fig:#BFD9D5; --fig-far:#4D6664; --fig-hair:#E6F0EE; --prop:#3D4A50; --mat:#2E3A40;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161A; --card:#192126; --ink:#E9EEEC; --muted:#93A09E; --line:#28333A; --soft:#1F2A30;
  --accent:#7CC5BA; --accent-ink:#0D1F1C; --accent-soft:#1D3633; --hl:#F29A80; --hl-soft:#3A2620;
  --gold:#DDB960; --ok:#7CCB9C; --ok-soft:#1B3326; --bad:#F08C78; --bad-soft:#3A221D;
  --fig:#BFD9D5; --fig-far:#4D6664; --fig-hair:#E6F0EE; --prop:#3D4A50; --mat:#2E3A40;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0}
a{color:var(--accent);-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
p{margin:.4rem 0}
.wrap{max-width:760px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom))}
.muted{color:var(--muted)} .small{font-size:.86rem} .num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.78rem;letter-spacing:.08em;color:var(--muted);margin:0 0 2px;text-transform:uppercase;font-weight:600}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 6px}
.top h1{font-size:1.75rem}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--ink);flex:none}
.iconbtn svg,.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.back{display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-weight:600;padding:8px 0;color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card h2{font-size:1.1rem}
.sec{font-size:1.05rem;margin:22px 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec a{font-size:.88rem;font-weight:600;text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:650;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{display:flex;width:100%}
.btn.small{min-height:36px;padding:0 12px;font-size:.88rem;border-radius:11px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.hl{background:var(--hl-soft);color:var(--hl)} .chip.acc{background:var(--accent-soft);color:var(--accent)} .chip.gold{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
.seg{display:flex;background:var(--soft);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;min-height:38px;border-radius:10px;padding:0 10px;font-weight:650;color:var(--muted);white-space:nowrap;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.filter{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.filter button{flex:none;min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:.88rem;color:var(--muted)}
.filter button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* 示范小人 */
.fig{display:block;width:100%;height:auto}
.fig .limb{stroke:var(--fig);stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig .limb.far{stroke:var(--fig-far)}
.fig .limb.hl{stroke:var(--hl)} .fig .limb.far.hl{stroke:color-mix(in srgb,var(--hl) 55%,var(--fig-far))}
.fig .hand{fill:var(--fig);stroke:none} .fig .hand.far{fill:var(--fig-far)}
.fig .head{fill:var(--fig)} .fig .head.hl{fill:var(--hl)} .fig .hair{fill:var(--fig-hair)}
.fig .mat line{stroke:var(--mat);stroke-width:4;stroke-linecap:round}
.fig .prop-wall{fill:var(--prop);opacity:.7} .fig .prop-chair{stroke:var(--prop);stroke-width:5;fill:none;stroke-linecap:round}
.fig .prop-step{fill:var(--prop)} .fig .prop-strap{stroke:var(--gold);stroke-width:2.2;stroke-dasharray:4 3}
.fig .prop-ball{fill:#C8D65B} .fig .prop-racket{stroke:var(--muted);stroke-linecap:round} .fig .prop-racket-head{fill:none;stroke:var(--muted);stroke-width:2}

/* 首页 */
.hero{padding:6px 0 2px}
.brand{width:48px;height:48px;border-radius:13px;flex:none;box-shadow:var(--shadow)}
.hero h1{font-size:1.9rem;line-height:1.2}
.hero .sub{color:var(--muted);margin:.25rem 0 0}
.streak{display:flex;gap:14px;align-items:center}
.streak .big{font-family:var(--f-num);font-size:2.6rem;font-weight:700;line-height:1;color:var(--hl)}
.streak .lbl{font-size:.82rem;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px;text-align:center}
.week .d{font-size:.72rem;color:var(--muted);font-weight:600}
.week .dots{display:flex;justify-content:center;gap:3px;margin-top:5px}
.week .dots i{width:9px;height:9px;border-radius:50%;background:var(--soft);display:block}
.week .dots i.day{background:var(--gold)} .week .dots i.night{background:#5468A8} .week .dots i.sport{background:var(--accent)}
.week .today .d{color:var(--ink)} .week .today .n{background:var(--ink);color:var(--bg)}
.week .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-family:var(--f-num);font-size:.86rem;font-weight:600;margin-top:2px}
.plan{position:relative;display:flex;gap:14px;align-items:center;border-radius:var(--r);padding:16px;margin:12px 0;color:#fff;text-decoration:none;overflow:hidden;min-height:118px;box-shadow:var(--shadow)}
.plan .txt{flex:1;min-width:0;position:relative;z-index:1}
.plan .eyebrow{color:rgba(255,255,255,.78)}
.plan h3{font-size:1.18rem;line-height:1.3}
.plan .meta{font-size:.84rem;opacity:.85;margin-top:4px}
.plan .figbox{width:110px;flex:none;position:relative;z-index:1}
.plan .figbox .fig .limb,.plan .figbox .fig .head{stroke:#fff}
.plan .figbox .fig .limb{stroke:rgba(255,255,255,.95)} .plan .figbox .fig .limb.far{stroke:rgba(255,255,255,.45)}
.plan .figbox .fig .head,.plan .figbox .fig .hand{fill:#fff} .plan .figbox .fig .hair{fill:rgba(255,255,255,.7)}
.plan .figbox .fig .limb.hl{stroke:#FFD8C7} .plan .figbox .fig .mat line{stroke:rgba(255,255,255,.25)}
.plan .figbox .fig .prop-wall,.plan .figbox .fig .prop-step{fill:rgba(255,255,255,.25)} .plan .figbox .fig .prop-chair{stroke:rgba(255,255,255,.35)}
.plan .done{position:absolute;top:12px;right:12px;z-index:2;background:rgba(255,255,255,.22);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:99px;padding:3px 10px;font-size:.76rem;font-weight:700;color:#fff}
.plan .go{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:rgba(255,255,255,.95);color:#1C2627;border-radius:99px;padding:7px 14px;font-weight:700;font-size:.88rem}
.plan .go svg{width:16px;height:16px;fill:currentColor}
.g-dawn{background:linear-gradient(135deg,#E9A27C,#C8786A 55%,#9C5C6E)}
.g-sage{background:linear-gradient(135deg,#5E9A8A,#2C6A64 60%,#1E4F4B)}
.g-sky{background:linear-gradient(135deg,#6E9CC3,#41709E 60%,#2D527A)}
.g-clay{background:linear-gradient(135deg,#D58C68,#B5654B 60%,#8A4A3C)}
.g-night{background:linear-gradient(135deg,#3B4A86,#232D5C 60%,#151B3A)}
.g-court{background:linear-gradient(135deg,#8DB255,#4E8A3E 55%,#2E6131)}
.plan::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.sports{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sport{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--card);text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.sport b{font-size:1rem} .sport span{font-size:.8rem;color:var(--muted)}
.sport .ico{width:30px;height:30px;margin-bottom:4px;color:var(--accent);fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.checkin label{display:block;font-weight:600;font-size:.94rem;margin:8px 0 4px}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.scale button{min-height:38px;border-radius:9px;background:var(--soft);font-family:var(--f-num);font-weight:600;font-size:.9rem}
.scale button[aria-pressed="true"]{background:var(--hl);color:#fff}
.opts3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opts3 button{min-height:40px;border-radius:11px;background:var(--soft);font-weight:600;font-size:.9rem}
.opts3 button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tip{display:flex;gap:12px;align-items:flex-start}
.tip .ico{flex:none;width:36px;height:36px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.focus{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.focus a{display:block;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:.86rem}
.focus a b{display:block;font-size:.92rem}
.focus a span{color:var(--muted);font-size:.78rem}

/* 列表 */
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 12px 8px 8px;text-decoration:none;color:var(--ink)}
.item .th{width:84px;flex:none;background:var(--soft);border-radius:12px;overflow:hidden}
.item h3{font-size:1rem;line-height:1.3}
.item .meta{font-size:.8rem;color:var(--muted);margin-top:2px}
.item .idx{font-family:var(--f-num);font-weight:700;color:var(--muted);width:20px;text-align:center;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:640px){.grid2{grid-template-columns:repeat(3,1fr)}}
.tile{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 8px 10px;text-decoration:none;color:var(--ink)}
.tile .th{background:var(--soft);border-radius:11px;overflow:hidden}
.tile h3{font-size:.94rem;margin:8px 4px 0;line-height:1.3}
.tile .meta{font-size:.76rem;color:var(--muted);margin:2px 4px 0}
.search{width:100%;min-height:44px;border-radius:13px;border:1px solid var(--line);background:var(--card);padding:0 14px;margin:6px 0}
.rhead{border-radius:0 0 28px 28px;margin:calc(-10px - env(safe-area-inset-top)) -16px 0;padding:calc(14px + env(safe-area-inset-top)) 18px 22px;color:#fff}
.rhead .back{color:#fff}
.rhead h1{font-size:1.6rem;margin-top:6px}
.rhead p{opacity:.88}
.rhead .stats{display:flex;gap:22px;margin-top:12px}
.rhead .stats b{display:block;font-family:var(--f-num);font-size:1.5rem;line-height:1.1}
.rhead .stats span{font-size:.76rem;opacity:.8}
.sticky{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));z-index:6;margin-top:16px}
.sticky .btn{box-shadow:0 8px 24px rgba(0,0,0,.18);min-height:54px;font-size:1.05rem;border-radius:16px}

/* 动作详情 */
.stage{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:8px;margin:10px 0;position:relative}
.stage .legend{position:absolute;left:14px;bottom:10px;display:flex;gap:6px;align-items:center;font-size:.74rem;color:var(--muted)}
.stage .legend i{width:12px;height:4px;border-radius:2px;background:var(--hl);display:inline-block}
.kv h3{font-size:.95rem;margin:14px 0 4px;color:var(--accent)}
.kv p{margin:.2rem 0}
.cues{margin:4px 0;padding-left:1.2rem} .cues li{margin:3px 0}
.note{border-left:3px solid var(--hl);background:var(--hl-soft);padding:10px 12px;border-radius:0 12px 12px 0;margin:10px 0;font-size:.94rem}
.note.acc{border-color:var(--accent);background:var(--accent-soft)}
.note.warn{border-color:var(--bad);background:var(--bad-soft)}

/* 播放器 */
.player{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;color:#fff;overflow:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.player .pbar{display:flex;gap:3px;padding:10px 16px 0}
.player .pbar i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden;display:block}
.player .pbar i b{display:block;height:100%;width:0;background:#fff}
.player .ptop{display:flex;align-items:center;justify-content:space-between;padding:8px 12px}
.player .ptop .ttl{font-size:.85rem;opacity:.85;text-align:center;flex:1}
.pbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);color:#fff}
.pbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pbtn.off{opacity:.45}
.pstage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding:0 16px;position:relative}
.pfig{width:min(92vw,460px);max-height:42vh;aspect-ratio:300/230}
.pfig .fig{height:100%}
.pfig .fig .limb{stroke:#F4F7F6} .pfig .fig .limb.far{stroke:rgba(255,255,255,.38)}
.pfig .fig .head,.pfig .fig .hand{fill:#F4F7F6} .pfig .fig .hair{fill:rgba(255,255,255,.75)}
.pfig .fig .limb.hl{stroke:#FFB59C} .pfig .fig .limb.far.hl{stroke:rgba(255,181,156,.6)} .pfig .fig .head.hl{fill:#FFB59C}
.pfig .fig .mat line{stroke:rgba(255,255,255,.18)} .pfig .fig .prop-wall,.pfig .fig .prop-step{fill:rgba(255,255,255,.18)} .pfig .fig .prop-chair{stroke:rgba(255,255,255,.3)}
.pfig .fig .prop-strap{stroke:#F6D78B} .pfig .fig .prop-racket,.pfig .fig .prop-racket-head{stroke:rgba(255,255,255,.7)}
.pname{text-align:center;margin-top:6px}
.pname h2{font-size:1.5rem}
.peyebrow{font-size:.8rem;font-weight:700;letter-spacing:.06em;opacity:.8;margin:0 0 2px}
.player.prepping .ring .fg{stroke:#FFD27A} .player.prepping .pcue{font-size:.95rem;opacity:.9}
.player.prepping .peyebrow{color:#FFD27A;opacity:1}
.pname .pside{display:inline-block;margin-top:6px;padding:3px 12px;border-radius:99px;background:rgba(255,255,255,.18);font-weight:700;font-size:.9rem}
.pname .plevel{font-size:.82rem;opacity:.75;margin-left:6px}
.pclock{display:flex;align-items:center;justify-content:center;gap:16px;margin:10px 0 4px}
.ring{position:relative;width:118px;height:118px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:rgba(255,255,255,.15)} .ring .fg{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-size:2.3rem;font-weight:700;line-height:1}
.ring .val>div{display:flex;flex-direction:column;align-items:center;gap:2px}
.ring .val small{display:block;font-size:.72rem;font-weight:600;opacity:.75;font-family:var(--f-ui)}
.breathe{position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(255,255,255,.35);transform:scale(.86);transition:transform 4s ease-in-out,opacity 1s;opacity:0}
.breathe.on{opacity:1} .breathe.in{transform:scale(1.08)}
.pcue{min-height:3.2em;text-align:center;font-size:1.06rem;padding:0 22px;opacity:.95;max-width:560px;margin:0 auto}
.pctl{display:flex;align-items:center;justify-content:center;gap:26px;padding:8px 0 14px}
.pctl .main{width:72px;height:72px;background:#fff;color:#1C2627}
.pctl .main svg{width:30px;height:30px;fill:currentColor;stroke:none}
.pdock{display:flex;justify-content:center;gap:10px;padding:0 0 12px}
.pdock button{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.12);color:#fff;font-size:.84rem;font-weight:600}
.pdock button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pdock button.off{opacity:.5}
.prep{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:3;padding:20px;text-align:center}
.prep .eyebrow{color:rgba(255,255,255,.8)}
.prep h2{font-size:1.7rem;margin:4px 0}
.prep .cnt{font-family:var(--f-num);font-size:3.4rem;font-weight:700;margin-top:6px}
.prep p{max-width:520px;opacity:.92}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:72%;overflow:auto;background:var(--card);color:var(--ink);border-radius:24px 24px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));z-index:6;transform:translateY(100%);transition:transform .3s ease}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 10px}
.finish{position:absolute;inset:0;z-index:7;background:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.finish h2{font-size:2rem}
.finish .stats{display:flex;gap:26px;margin:18px 0}
.finish .stats b{display:block;font-family:var(--f-num);font-size:2rem}
.finish .stats span{font-size:.8rem;opacity:.8}
.finish .feel{display:flex;gap:8px;margin:12px 0 18px}
.finish .feel button{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.15);font-size:1.5rem}
.finish .feel button[aria-pressed="true"]{background:#fff}
.finish .badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);border-radius:99px;padding:6px 14px;font-weight:700;margin:4px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;opacity:.9;animation:fall 2.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}

/* 进度 */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;overflow-x:auto}
.heat i{width:14px;height:14px;border-radius:4px;background:var(--soft);display:block}
.heat i.l1{background:color-mix(in srgb,var(--accent) 35%,var(--soft))} .heat i.l2{background:color-mix(in srgb,var(--accent) 65%,var(--soft))} .heat i.l3{background:var(--accent)}
.heat i.t{outline:2px solid var(--hl);outline-offset:1px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.kpis b{display:block;font-family:var(--f-num);font-size:1.6rem;line-height:1.15}
.kpis span{font-size:.76rem;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart .ax{stroke:var(--line)} .chart .ln{fill:none;stroke:var(--hl);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--hl)} .chart text{font-size:10px;fill:var(--muted);font-family:var(--f-num)}
.chart .ln.b{stroke:var(--accent)} .chart .pt.b{fill:var(--accent)}
.badges{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.badges div{text-align:center;font-size:.72rem;color:var(--muted)}
.badges .bi{width:48px;height:48px;margin:0 auto 4px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--muted)}
.badges .on .bi{background:linear-gradient(135deg,#F0C66B,#D9893F);color:#fff}
.badges .on{color:var(--ink)}
.badges .bi svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t th,table.t td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:center}
table.t th{color:var(--muted);font-weight:600;font-size:.78rem}
table.t td:first-child,table.t th:first-child{text-align:left}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{font-weight:600}
.field small{display:block;color:var(--muted);font-weight:400;font-size:.8rem}
.field input[type=number],.field input[type=time],.field select{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 10px;max-width:52%}
.field input[type=number]{width:96px}
.field input[type=range]{width:46%;accent-color:var(--accent)}
.switch{position:relative;width:52px;height:32px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.switch input:checked+span{background:var(--accent)} .switch input:checked+span::after{transform:translateX(20px)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:.8rem;background:var(--soft);padding:2px 6px;border-radius:6px;word-break:break-all}
ol.steps{padding-left:1.2rem;margin:6px 0} ol.steps li{margin:4px 0}

/* 教练（相机）*/
.cam{position:relative;background:#000;border-radius:20px;overflow:hidden;aspect-ratio:3/4;max-height:70vh;margin:10px auto}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cam .mirror{transform:scaleX(-1)}
.cam .hud{position:absolute;left:10px;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.cam .hud .pill{align-self:flex-start;background:rgba(0,0,0,.55);color:#fff;border-radius:12px;padding:6px 10px;font-size:.9rem;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.cam .hud .pill b{font-family:var(--f-num);font-size:1.2rem}
.cam .hud .pill.good{background:rgba(47,122,79,.8)} .cam .hud .pill.warn{background:rgba(194,65,45,.82)}
.cam .msg{position:absolute;inset:0;display:grid;place-items:center;color:#fff;text-align:center;padding:20px;font-size:.95rem}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--card);text-align:left;box-shadow:var(--shadow)}
.mode b{display:block} .mode span{font-size:.8rem;color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mode[data-m="video"]{grid-column:1/-1;background:linear-gradient(135deg,var(--accent-soft),var(--card))}
.report .shot{border-radius:14px;overflow:hidden;background:#000;margin:8px 0}
.report .shot canvas{display:block;width:100%;height:auto}
.metric{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.metric:last-child{border-bottom:0}
.metric .st{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem}
.metric .st.ok{background:var(--ok-soft);color:var(--ok)} .metric .st.mid{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold)} .metric .st.bad{background:var(--bad-soft);color:var(--bad)} .metric .st.na{background:var(--soft);color:var(--muted)}
.metric b{display:block} .metric p{margin:.15rem 0;font-size:.9rem;color:var(--muted)}
.progressbar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin:8px 0}
.progressbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.scrub{width:100%;accent-color:var(--accent)}

/* 底部导航 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:650}
.tabbar a svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar a.on{color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:.92rem;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#update{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:90;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:9px 16px;font-weight:650;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:70;background:rgba(10,14,16,.5);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
@media (min-width:640px){.modal{align-items:center}.modal .box{border-radius:24px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap" id="main"><p class="loading">正在打开……</p></main>
<nav class="tabbar" id="tabbar" aria-label="主导航">

  <a href="#/plans" data-tab="plans"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16.5" rx="3"/><path d="M3.5 9h17M8 2.5v3M16 2.5v3M8 13h3M8 16.5h6"/></svg>计划</a>
  <a href="#/library" data-tab="library"><svg viewBox="0 0 24 24"><circle cx="12" cy="4.6" r="2"/><path d="M5 9.5l7 1.5 7-1.5M12 11v4.5l-3.5 6M12 15.5l3.5 6"/></svg>动作库</a>
  <a href="#/coach" data-tab="coach"><svg viewBox="0 0 24 24"><path d="M3.5 8.5A2 2 0 0 1 5.5 6.5h2l1.5-2h6l1.5 2h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>教练</a>

</nav>
<button id="update" hidden>有新版本，点这里刷新</button>

<script>
// 先读 version.json（不走缓存），再按版本号加载，保证 Kevin 改完后 Grace 这边拿到最新内容
(function () {
  function load(v) {
    window.STRETCH_VERSION = v || "dev";
    var q = v ? "?v=" + encodeURIComponent(v) : "";
    ["figure.js", "sound.js", "data.js", "app.js"].reduce(function (p, src) {
      return p.then(function () { return new Promise(function (res, rej) { var s = document.createElement("script"); s.src = src + q; s.onload = res; s.onerror = rej; document.body.appendChild(s); }); });
    }, Promise.resolve()).catch(function () { document.getElementById("main").innerHTML = '<p class="loading">加载失败，请检查网络后刷新。</p>'; });
  }
  fetch("version.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.json(); })
    .then(function (j) { load(j && j.v); }).catch(function () { load(null); });
})();
</script>
