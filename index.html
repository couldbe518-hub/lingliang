<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4F6F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1220" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<title>灵粮读经</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="灵粮读经">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* 版式：单栏阅读本，书签丝带 + 金色下划线标记经典经文；底部五个标签页 */
:root{
  --paper:#F4F6F2; --card:#FFFFFF; --ink:#1C2232; --muted:#5D6574; --line:#DCE0D7;
  --accent:#2C3D7C; --accent-soft:#E6EAF6; --gold:#A6771A; --gold-soft:#F5ECD8; --care:#8E3B3B; --care-soft:#F7E9E6; --hl-y:#FBF0C4; --hl-g:#DDEEDC; --hl-b:#DCE6F5; --hl-p:#F7E1E1; --hl-v:#E9E0F2; --ok:#2F6B4F;
  --f-scripture:"Noto Serif SC","Songti SC","STSong",serif;
  --f-en:"Source Serif 4","Georgia",serif;
  --f-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --fs:1.12rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1220; --card:#161B2B; --ink:#E7E3D7; --muted:#9BA1AF; --line:#283044;
  --accent:#93A6EA; --accent-soft:#1E2640; --gold:#D9B45E; --gold-soft:#2B2617; --care:#E39A92; --care-soft:#2C1B1C; --hl-y:#45391A; --hl-g:#213A24; --hl-b:#1E2C44; --hl-p:#3F2428; --hl-v:#33274A; --ok:#7CC4A0; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1220; --card:#161B2B; --ink:#E7E3D7; --muted:#9BA1AF; --line:#283044;
  --accent:#93A6EA; --accent-soft:#1E2640; --gold:#D9B45E; --gold-soft:#2B2617; --care:#E39A92; --care-soft:#2C1B1C; --hl-y:#45391A; --hl-g:#213A24; --hl-b:#1E2C44; --hl-p:#3F2428; --hl-v:#33274A; --ok:#7CC4A0; color-scheme:dark}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.65rem .8rem;width:100%}
textarea{min-height:5.5rem;resize:vertical}
a{color:var(--accent)}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:12px 120px}
h1,h2,h3{text-wrap:balance;margin:0;font-family:var(--f-scripture);font-weight:600}
h1{font-size:1.65rem;line-height:1.25}
h2{font-size:1.2rem}
h3{font-size:1.02rem}
.eyebrow{font-size:.74rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.ribbon{position:relative;padding-top:20px}
.ribbon::before{content:"";position:absolute;top:-1px;right:22px;width:14px;height:30px;background:var(--gold);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:.55rem .95rem;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:.92rem}
.btn.primary{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.btn.gold{background:var(--gold);color:var(--paper);border-color:var(--gold)}
.btn.ghost{background:transparent}
.btn.sm{padding:.35rem .7rem;font-size:.84rem}
.chip{display:inline-flex;padding:.4rem .8rem;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:.88rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{padding:.38rem .8rem;font-size:.86rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--paper)}
.scripture{font-family:var(--f-scripture);font-size:var(--fs);line-height:1.9}
.en{font-family:var(--f-en);font-size:calc(var(--fs)*.94);line-height:1.6;color:var(--muted)}
.ref{font-size:.84rem;color:var(--gold);font-weight:600;letter-spacing:.04em}
.note{font-size:.8em;color:var(--muted)}
/* 标签栏 */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:30}
.tabbar .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:680px;width:100%}
.tabbar button{padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted)}
.tabbar button svg{width:23px;height:23px}
.tabbar button[aria-current="page"]{color:var(--accent)}
/* 顶栏 */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:12px}
.topbar .t{flex:1;min-width:0;font-family:var(--f-scripture);font-weight:600;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}
/* 今日 */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week .d{font-size:.72rem;color:var(--muted)}
.week .dot{width:28px;height:28px;margin:4px auto 0;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.75rem;font-variant-numeric:tabular-nums}
.week .dot.on{background:var(--gold);border-color:var(--gold);color:var(--paper)}
.week .dot.today{border-color:var(--accent)}
.streak{font-family:var(--f-scripture);font-size:2.4rem;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.check{width:26px;height:26px;flex:none;border-radius:8px;border:1.5px solid var(--muted);display:grid;place-items:center;margin-top:2px}
.check.on{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.check svg{width:16px;height:16px}
.task .body{flex:1;min-width:0}
.pray2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.praybtn{border-radius:14px;padding:16px 14px;text-align:left;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:4px}
.praybtn b{font-family:var(--f-scripture);font-size:1.1rem}
.praybtn.done{border-color:var(--ok)}
.praybtn .st{font-size:.78rem;color:var(--muted)}
.praybtn.done .st{color:var(--ok)}
/* 圣经 */
.cat{display:flex;flex-direction:column;gap:8px}
.cat h3{font-size:.9rem;color:var(--muted);font-family:var(--f-ui);font-weight:600;letter-spacing:.05em;display:flex;align-items:center;gap:8px}
.cat h3 i{width:10px;height:10px;border-radius:3px;display:inline-block}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.bk{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;overflow:hidden}
.bk b{font-family:var(--f-scripture);font-size:1.15rem}
.bk span{font-size:.7rem;color:var(--muted);white-space:nowrap}
.bk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.chlist{display:flex;flex-direction:column}
.ch{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.ch .n{font-family:var(--f-scripture);font-size:1.3rem;color:var(--gold);text-align:center;font-variant-numeric:tabular-nums;line-height:1.2}
.ch .n small{display:block;font-size:.62rem;color:var(--muted);font-family:var(--f-ui)}
.ch .tt{font-weight:600;font-family:var(--f-scripture)}
.ch .ss{font-size:.88rem;color:var(--muted);line-height:1.5}
.ch .tags{margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.7rem;padding:1px 7px;border-radius:999px;background:var(--gold-soft);color:var(--gold)}
.tag.read{background:var(--accent-soft);color:var(--ok)}
.intro dl{display:grid;grid-template-columns:4.2em 1fr;gap:6px 10px;margin:0;font-size:.9rem}
.intro dt{color:var(--muted)}
.intro dd{margin:0;min-width:0}
/* 章节阅读 */
.sum{background:var(--gold-soft);border-radius:12px;padding:12px 14px;font-size:.92rem}
.sum b{font-family:var(--f-scripture)}
.verses{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.sh{font-family:var(--f-en);font-style:italic;color:var(--accent);font-size:.9rem;margin:14px 0 2px}
.v{padding:6px 6px;border-radius:8px;text-align:left;width:100%;display:block}
.v .num{font-family:var(--f-ui);font-size:.68em;color:var(--gold);vertical-align:super;margin-right:3px;font-weight:600}
.v.kv .zh{text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:2px;text-underline-offset:6px}
.v.kv .en{text-decoration:underline dotted;text-decoration-color:var(--gold);text-underline-offset:4px}
.v.speaking{background:var(--accent-soft)}
.v.sel{background:var(--gold-soft)}
.v.fav .num::after{content:" ♥";color:var(--care)}
.v .en{display:block;margin-top:2px}
.v.merged{opacity:.55}
.v .zh,.v .en{color:var(--ink-s,inherit)}
.v.hl-y{background:var(--hl-y)} .v.hl-g{background:var(--hl-g)} .v.hl-b{background:var(--hl-b)} .v.hl-p{background:var(--hl-p)} .v.hl-v{background:var(--hl-v)}
.v .mynote{display:block;margin:6px 0 2px;padding:6px 10px;border-left:3px solid var(--accent);background:var(--accent-soft);font-size:.86rem;line-height:1.6;border-radius:0 8px 8px 0;white-space:pre-wrap;font-family:var(--f-ui)}
.hlrow{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px 0}
.hlbtn{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.74rem;color:var(--muted)}
.hlbtn i{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.hlbtn.on i{outline:2px solid var(--accent);outline-offset:2px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;border:1px solid var(--muted);vertical-align:-1px}
.chnote{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:14px}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line)}
.sw button.on{outline:2px solid var(--accent);outline-offset:2px}
.li.hl-y{background:var(--hl-y)} .li.hl-g{background:var(--hl-g)} .li.hl-b{background:var(--hl-b)} .li.hl-p{background:var(--hl-p)} .li.hl-v{background:var(--hl-v)}
.li[class*="hl-"]{padding:10px;border-radius:10px;border-top:0;margin-top:6px}
.kvmark{display:inline-block;font-size:.66rem;font-family:var(--f-ui);color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:2px}
.pstitle{font-size:.88rem;color:var(--muted);font-style:italic;margin-bottom:4px}
.navch{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:18px}
/* 底部抽屉 */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.42);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:18px 18px 0 0;max-height:86vh;overflow:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet .inner{max-width:648px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sec h4{margin:0 0 4px;font-size:.8rem;color:var(--gold);letter-spacing:.08em}
.sec p{margin:0;font-size:.95rem;line-height:1.7}
.idx li{font-size:.88rem}
/* 播放条 */
.player{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:29;display:flex;justify-content:center;padding:0 12px}
.player .in{max-width:656px;width:100%;background:var(--accent);color:var(--paper);border-radius:14px;padding:8px 10px 8px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.player .in span{flex:1;min-width:0;font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player button{padding:.35rem .7rem;border-radius:999px;background:rgba(255,255,255,.16);font-size:.84rem;color:var(--paper)}
/* 情境 */
.scgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sc{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:3px}
.sc b{font-family:var(--f-scripture);font-size:1.05rem}
.sc span{font-size:.78rem;color:var(--muted);line-height:1.4}
.ask{background:var(--accent);color:var(--paper);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.ask h2{color:var(--paper)}
.ask input{border-color:transparent}
.care{background:var(--care-soft);color:var(--care);border-radius:12px;padding:12px 14px;font-size:.9rem}
.word{font-family:var(--f-scripture);font-size:1.15rem;line-height:1.7;border-left:3px solid var(--gold);padding-left:12px}
.psg{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-top:1px solid var(--line)}
.psg:first-child{border-top:0}
.prayer{font-family:var(--f-scripture);line-height:1.9;font-size:1.02rem}
/* 祷告陪伴 */
.comp{position:fixed;inset:0;z-index:50;background:var(--paper);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.comp .in{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-height:100%}
.dots{display:flex;gap:6px}
.dots i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--gold)}
.comp .stepname{font-family:var(--f-scripture);font-size:1.6rem}
.comp .guide{font-size:1.02rem;line-height:1.8}
.comp .grow{flex:1}
.breath{width:150px;height:150px;border-radius:50%;margin:10px auto;border:2px solid var(--gold);display:grid;place-items:center;font-family:var(--f-scripture);color:var(--gold);animation:breathe 10s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.82)}50%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.breath{animation:none}}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .body{flex:1;min-width:0}
.answered{color:var(--ok);font-size:.8rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:.55rem 1rem;border-radius:999px;font-size:.88rem;z-index:60}
.hl{background:var(--gold-soft);border-radius:3px}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold)}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.rd summary{line-height:1.5}
.hv{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.hv:first-child{border-top:0}
.hvn{font-family:var(--f-scripture);color:var(--gold);font-size:1.1rem;text-align:center}
.hv.ref2{background:var(--gold-soft);border-radius:10px;padding:10px 8px;border-top:0;margin:4px 0}
.hymnbody .en{font-size:calc(var(--fs)*1.0);line-height:1.75}
.rd summary::after{content:"展开";float:right;font-size:.75rem;color:var(--muted)}
.rd[open] summary::after{content:"收起"}
.steps li{margin-bottom:6px}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
</style>
<style>
html{-webkit-text-size-adjust:100%;color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>

<div id="app"><div class="wrap"><div class="loading">正在打开圣经……</div></div></div>
<nav class="tabbar" aria-label="主导航"><div class="in" id="tabs"></div></nav>
<div id="player" hidden></div>
<div id="layer"></div>

<script>

let VOICE=null,AUD=null;const SILENT="data:audio/wav;base64,UklGRrQBAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZABAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA";
fetch("voice/manifest.json").then(r=>r.ok?r.json():null).then(v=>{VOICE=v}).catch(()=>{});
const clipKey=t=>cleanZh(t).replace(/[，。、；：！？,.!?;:\s…]+$/,"");
function clipFor(text){if(!VOICE||!VOICE.lines||!S.voiceClip)return null;const e=VOICE.lines[clipKey(text)];return e?e[0]:null}
function clipsCover(items){const zh=items.filter(i=>i.lang==="zh");return zh.length>0&&zh.every(i=>clipFor(i.text))}
function speakUtter(it,sid){if(!("speechSynthesis" in window)){TTS.i++;next();return}const u=new SpeechSynthesisUtterance(it.lang==="zh"?cleanZh(it.text):it.text);u.lang=it.lang==="zh"?"zh-CN":"en-US";const v=pickVoice(it.lang);if(v)u.voice=v;u.rate=it.lang==="zh"?S.rate:Math.min(S.rate*.95,1.6);u.onend=()=>{if(sid!==TTS.sid)return;TTS.i++;next()};u.onerror=()=>{if(sid!==TTS.sid)return;TTS.i++;next()};try{speechSynthesis.speak(u)}catch(e){stopTTS()}}
function clipRate(){return S.rate<.9?0.8:S.rate>1.2?1.4:S.rate>1?1.2:1.0}
function playClip(it,sid){const f=clipFor(it.text);if(!f){speakUtter(it,sid);return}const a=AUD||(AUD=new Audio());a.onended=a.onerror=null;a.src="voice/"+S.voiceClip+"/"+f;a.playbackRate=clipRate();try{a.preservesPitch=true}catch(e){}a.onended=()=>{if(sid!==TTS.sid)return;TTS.i++;next()};a.onerror=()=>{if(sid!==TTS.sid)return;speakUtter(it,sid)};a.play().catch(()=>{if(sid!==TTS.sid)return;speakUtter(it,sid)})}
function unlockTTS(){if(UNLOCKED)return;UNLOCKED=true;try{AUD=AUD||new Audio();AUD.src=SILENT;AUD.play().catch(()=>{})}catch(e){}try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}catch(e){}}
function voices(){try{return speechSynthesis.getVoices()}catch(e){return []}}
function pickVoice(lang){const vs=voices();const pref=lang==="zh"?S.voiceZh:S.voiceEn;let v=vs.find(x=>x.name===pref);if(v)return v;if(lang==="zh")return vs.find(x=>/zh[-_]CN/i.test(x.lang)&&/Tingting|婷婷|Lili|Xiaoxiao/i.test(x.name))||vs.find(x=>/zh[-_]CN/i.test(x.lang))||vs.find(x=>/^zh/i.test(x.lang));return vs.find(x=>/en[-_]US/i.test(x.lang)&&/Samantha|Alex|Ava|Allison/i.test(x.name))||vs.find(x=>/en[-_](US|GB)/i.test(x.lang))||vs.find(x=>/^en/i.test(x.lang))}
function speak(items,label){const clip=clipsCover(items);if(!clip&&!("speechSynthesis" in window)){toast("这台设备不支持朗读");return}stopTTS(true);TTS.sid++;TTS.clip=clip;TTS.q=items;TTS.i=0;TTS.on=true;TTS.label=label||"朗读中";renderPlayer();next()}
function next(){if(!TTS.on)return;document.querySelectorAll(".v.speaking").forEach(e=>e.classList.remove("speaking"));if(TTS.i>=TTS.q.length){stopTTS();return}const it=TTS.q[TTS.i];if(it.el){const el=document.getElementById(it.el);if(el){el.classList.add("speaking");el.scrollIntoView({block:"center",behavior:"smooth"})}}const sid=TTS.sid;if(TTS.clip&&it.lang==="zh")playClip(it,sid);else speakUtter(it,sid)}
function stopTTS(silent){TTS.on=false;TTS.sid++;try{speechSynthesis.cancel()}catch(e){}if(AUD){try{AUD.onended=AUD.onerror=null;AUD.pause()}catch(e){}}document.querySelectorAll(".v.speaking").forEach(e=>e.classList.remove("speaking"));if(!silent)renderPlayer()}
function renderPlayer(){const p=$("#player");if(!TTS.on){p.hidden=true;p.innerHTML="";return}p.hidden=false;p.className="player";p.innerHTML=`<div class="in"><span>${TTS.clip?"Kevin 的声音":"朗读中"} · ${esc(TTS.label)}</span><button data-act="ttsSkip">下一节</button><button data-act="ttsStop">停止</button></div>`}
function chapterQueue(b,c,d,from=1,mode){mode=mode||(S.mode==="both"?"both":S.mode);const q=[];const zh=d.zh[c-1],en=d[S.en][c-1]||[];if(from===1){if(mode!=="en")q.push({lang:"zh",text:BOOKS[b-1][0]+"第"+c+"章"});if(mode==="en")q.push({lang:"en",text:BOOKS[b-1][2]+" chapter "+c})}for(let v=from;v<=zh.length;v++){if(isMerged(zh[v-1]))continue;if(mode!=="en")q.push({lang:"zh",text:zh[v-1],el:"v"+v});if(mode!=="zh"&&en[v-1])q.push({lang:"en",text:en[v-1],el:"v"+v})}return q}

async function rerender(){const y=window.scrollY;VIEW.v=0;await render();window.scrollTo(0,y)}
function back(){const v=HIST.pop()||{name:S.tab};go(v,false)}
function renderTabs(){const T=[["today","今日"],["bible","圣经"],["seek","寻求"],["pray","祷告"],["search","查找"]];const cur={chapter:"bible",book:"bible",scen:"seek",hymns:"pray",hymn:"pray"}[VIEW.name]||VIEW.name;$("#tabs").innerHTML=T.map(([k,n])=>`<button data-act="tab" data-k="${k}" ${cur===k?'aria-current="page"':""}>${IC[k]}<span>${n}</span></button>`).join("")}
async function render(){renderTabs();const f=V[VIEW.name];const app=$("#app");try{app.innerHTML=`<div class="wrap">${await f(VIEW)}</div>`}catch(e){app.innerHTML=`<div class="wrap"><div class="card">页面打开失败：${esc(e.message)}。请检查网络后刷新。</div></div>`}after[VIEW.name]&&after[VIEW.name](VIEW)}

function matchScen(q){const fam=/妈妈|爸爸|母亲|父亲|孩子|儿子|女儿|丈夫|妻子|老公|老婆|父母|家人|婆婆|公公|奶奶|爷爷|外婆|外公|弟弟|妹妹|哥哥|姐姐/.test(q);return C.scen.map(s=>{let n=0;s.kw.split(/\s+/).forEach(w=>{if(w&&q.includes(w))n+=w.length});if(q.includes(s.n))n+=5;if(n&&fam&&(s.id==="sickfam"||s.id==="family"))n+=3;if(n&&fam&&s.id==="sick")n-=1;return [n,s]}).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).map(x=>x[1])}

async function exportFile(){const name="lingliang-backup-"+dstr()+".json";const txt=JSON.stringify(S);const file=new File([txt],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e&&e.name==="AbortError")return}}const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast("已导出："+name)}
async function importFile(e){const f=e.target.files[0];if(!f)return;e.target.value="";try{const o=JSON.parse(await f.text());if(!o||typeof o!=="object"||!o.days)throw 0;openSheet(`<h3>导入备份</h3><p class="small muted">备份含 ${Object.keys(o.read||{}).length} 章打卡、${(o.fav||[]).length} 条收藏、${Object.keys(o.marks||{}).length} 处高亮或注释、${(o.prayers||[]).length} 条代祷。导入会用备份覆盖本机现有记录。</p><div class="row"><button class="btn sm" data-act="closeSheet">取消</button><button class="btn sm primary" id="impGo">确定导入</button></div>`);$("#impGo").addEventListener("click",()=>{S=Object.assign({},DEF,o);save();applyPrefs();closeSheet();render();toast("已导入")})}catch(x){toast("这不是灵粮读经的备份文件")}}
/* ---------- 离线：首次联网后自动把全本经文存入手机 ---------- */
const OFF={busy:false,n:0,done:false};
function offStatus(){const el=$("#offStatus");if(!el)return;el.textContent=OFF.done?"全本经文已存在手机里，没有网络也能读经。":OFF.busy?`正在为离线准备经文 ${OFF.n}/66…`:`离线经文 ${OFF.n}/66，${navigator.onLine===false?"连上网络后会自动继续":"稍后自动继续"}`}
async function ensureOffline(force){if(OFF.busy||!("caches"in window)||navigator.onLine===false)return;try{const c=await caches.open("lingliang-data");const have=new Set((await c.keys()).map(r=>r.url));const todo=[];for(let i=1;i<=66;i++){const u=new URL("data/"+pad2(i)+".json",location.href).href;if(force||!have.has(u))todo.push(u)}OFF.n=66-todo.length;OFF.done=!todo.length;offStatus();if(OFF.done)return;OFF.busy=true;offStatus();for(const u of todo){const r=await fetch(u,{cache:force?"reload":"default"});if(!r.ok)throw 0;await c.put(u,r.clone());OFF.n++;offStatus()}OFF.done=true}catch(e){}OFF.busy=false;offStatus()}
if("serviceWorker"in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});setTimeout(()=>ensureOffline(false),2500);window.addEventListener("online",()=>ensureOffline(false))}
(async()=>{try{await loadContent()}catch(e){$("#app").innerHTML=`<div class="wrap"><div class="card">内容载入失败，请检查网络后刷新页面。</div></div>`;return}
 VIEW={name:S.tab||"today"};if(["chapter","book","scen"].includes(VIEW.name))VIEW={name:"today"};await render();fromHash()})();
