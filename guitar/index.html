<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">

<title>Natalie 吉他</title>
<meta name="description" content="Natalie 的每日吉他练习：六线谱、和弦图、跟谱练（听音自动翻页）、调音器、识谱、录音。">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Natalie 吉他">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
/* 为中老年使用者设计：大字、大按钮、高对比；暖色木纹吉他配色 */
:root{
  --fs:1.12;
  --paper:#FBF6EE; --card:#FFFFFF; --ink:#1F1B16; --muted:#5E564B; --line:#E3D9CA;
  --accent:#9A4A12; --accent-ink:#FFFFFF; --accent-soft:#F6E6D6; --gold:#B07A1C;
  --ok:#1E7F45; --ok-soft:#DFF2E5; --bad:#C2311F; --bad-soft:#FBE4DF; --tgt:#FF9F0A;
  --sheet:#FFFDF8; --sheet-ink:#1A1714;
  --f-ui:"PingFang SC","Noto Sans SC","Microsoft YaHei",-apple-system,Roboto,sans-serif;
  --f-head:"Noto Serif SC","Songti SC",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16130F; --card:#221D17; --ink:#F2EBDF; --muted:#B8AE9F; --line:#3A3229;
  --accent:#F0A267; --accent-ink:#1E120A; --accent-soft:#3B2618; --gold:#E2B55A;
  --ok:#6FD49A; --ok-soft:#173022; --bad:#FF8B78; --bad-soft:#3A1E1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16130F; --card:#221D17; --ink:#F2EBDF; --muted:#B8AE9F; --line:#3A3229;
  --accent:#F0A267; --accent-ink:#1E120A; --accent-soft:#3B2618; --gold:#E2B55A;
  --ok:#6FD49A; --ok-soft:#173022; --bad:#FF8B78; --bad-soft:#3A1E1A; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);margin:0}
body{color:var(--ink);font-family:var(--f-ui);font-size:calc(17px * var(--fs));line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-head);font-weight:700;margin:0;text-wrap:balance}
.wrap{max-width:980px;margin:0 auto;padding:12px 16px calc(110px + env(safe-area-inset-bottom))}
.muted{color:var(--muted)} .small{font-size:.86em} .center{text-align:center}
.eyebrow{font-size:.82em;color:var(--muted);margin:0 0 2px}
.hero{padding:16px 0 6px} .hero h1{font-size:1.9em} .hero .sub{margin:.3rem 0 0;color:var(--muted)}
.pagehead{padding:8px 0 6px} .pagehead h1{font-size:1.6em} .pagehead p{margin:.3rem 0 0}
.back{display:inline-block;text-decoration:none;padding:8px 0;font-size:1.05em}
.en{color:var(--muted);margin:2px 0 0;font-size:.92em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.h2{font-size:1.15em;margin-bottom:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:52px;padding:0 18px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700;text-decoration:none;color:var(--ink);white-space:nowrap;font-size:1em}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.rec.on{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger{color:var(--bad)} .btn:disabled{opacity:.45}
.btn.wide{display:flex;width:100%;margin:10px 0} .big-btn{min-height:60px;font-size:1.15em;width:100%;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stats b{display:block;font-size:1.7em;font-family:var(--f-head)} .stats span{font-size:.82em;color:var(--muted)}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:12px}
@media (min-width:760px){.steps{grid-template-columns:1fr 1fr}}
.step{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.step .num{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:1.1em}
.step.done .num{background:var(--ok-soft);color:var(--ok)}
.step h3{font-size:1.15em;margin:2px 0} .step p{margin:.2rem 0 .7rem}
.cal{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;max-width:520px}
.cal i{aspect-ratio:1;border-radius:4px;background:var(--line)}
.cal i.c1{background:#B9DCC5} .cal i.c2{background:#7FC39A} .cal i.c3,.cal i.c4{background:var(--ok)} .cal i.t{outline:2px solid var(--accent);outline-offset:1px}
.foot{text-align:center;margin:22px 0}
.seg{display:flex;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin:10px 0}
.seg button{flex:1;min-height:50px;border-radius:10px;padding:0 8px;font-weight:700;color:var(--muted);font-size:1em}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:disabled{opacity:.35}
.songs{display:grid;gap:12px} @media (min-width:700px){.songs{grid-template-columns:1fr 1fr}}
.song{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-decoration:none;color:var(--ink)}
.song h3{font-size:1.2em;margin-top:6px}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lv{font-size:.8em;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--ok-soft);color:var(--ok)}
.lv2{background:#F5ECD8;color:#86600F} .lv3{background:var(--accent-soft);color:var(--accent)}
.chips2{font-size:.85em;color:var(--muted)}
.tag{font-size:.78em;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--accent);color:var(--accent-ink)}
.hbs{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:.88em;color:var(--muted)}
.stx{color:var(--line)} .stx.on{color:var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0;font-size:.86em} .chips span{padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)} .chips .lv{border:0}
.tip{background:var(--card);border-left:5px solid var(--gold);border-radius:10px;padding:12px 14px;margin:10px 0}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:6px 0 8px}
.bar .hint{flex-basis:100%;margin:2px 0 0;font-size:.92em;color:var(--muted)}
.speed{display:flex;align-items:center;gap:8px;color:var(--muted)} .speed input{width:120px;accent-color:var(--accent)} .speed output{min-width:3em;color:var(--ink)}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:48px}
.chk input{width:24px;height:24px;accent-color:var(--accent)}
.live{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:6px 0;font-size:1.05em;position:sticky;top:6px;z-index:5}
.live b{font-size:1.2em} .live .big-c{font-size:1.6em;color:var(--accent)} .bad-t{color:var(--bad);font-weight:700}
.nowchord{display:flex;gap:16px;align-items:flex-end;justify-content:center;background:var(--sheet);color:var(--sheet-ink);border:2px solid var(--line);border-radius:16px;padding:8px 12px;margin:8px 0}
.nc-now,.nc-next{display:flex;flex-direction:column;align-items:center} .nc-l{font-size:.8em;color:#6B6156}
.nc-now.on svg{filter:drop-shadow(0 0 6px rgba(255,159,10,.9))} .nc-now.on .cd-n{fill:#C25E00}
.nc-next{opacity:.7}
.score{background:var(--sheet);color:var(--sheet-ink);border:1px solid var(--line);border-radius:14px;padding:6px 4px;margin:8px 0;overflow:hidden}
.score > svg{display:block;max-width:100%;height:auto}
/* 六线谱 */
.tab .tl{stroke:#8C8478;stroke-width:1.2} .tab .tb{stroke:#5A5348;stroke-width:1.4} .tab .tbe{stroke:#1A1714;stroke-width:4}
.tab .tclef{font:700 13px var(--f-ui);fill:#5A5348;text-anchor:middle} .tab .tmeter{font:700 12px var(--f-ui);fill:#5A5348}
.tab .nb{fill:#FFFDF8} .tab .nf{font-family:var(--f-ui);font-weight:800;fill:#1A1714;text-anchor:middle}
.tab .stem{stroke:#1A1714;stroke-width:1.6} .tab .flag{stroke:#1A1714;stroke-width:1.6;fill:none} .tab .dot{fill:#1A1714}
.tab .rest{font:13px var(--f-ui);fill:#6B6156;text-anchor:middle}
.tab .lyr{font-family:var(--f-ui);fill:#2A251F;text-anchor:middle} .tab .lyr.bl{text-anchor:start}
.tab .cname{font:800 16px var(--f-ui);fill:#9A4A12;text-anchor:middle}
.tab .arrow{stroke:#1A1714;stroke-width:2.4} .tab .arrowh{stroke:#1A1714;stroke-width:2.4;fill:none} .tab .sdir{font:700 14px var(--f-ui);fill:#5A5348;text-anchor:middle}
.tab .ev,.tab .st,.tab .cs{cursor:pointer}
.tab .cur .nb,.tab .target .nb{fill:#FF9F0A} .tab .cur .nf,.tab .target .nf{fill:#fff}
.tab .st.cur .arrow,.tab .st.cur .arrowh,.tab .st.target .arrow,.tab .st.target .arrowh{stroke:#FF9F0A;stroke-width:3.4}
.tab .cs.cur svg,.tab .cs.target svg{filter:drop-shadow(0 0 4px rgba(255,159,10,1))} .tab .cs.cur .cd-n,.tab .cs.target .cd-n{fill:#C25E00}
.tab .ok .nb{fill:#34C759} .tab .ok .nf{fill:#fff} .tab .st.ok .arrow,.tab .st.ok .arrowh{stroke:#1E9E4A}
.tab .bad .nb,.tab .miss .nb{fill:#FF3B30} .tab .bad .nf,.tab .miss .nf{fill:#fff} .tab .st.bad .arrow,.tab .st.miss .arrow,.tab .st.bad .arrowh,.tab .st.miss .arrowh{stroke:#D93025}
.tab .from .nb{fill:#E8C47A}
/* 和弦图 */
.cd .cd-n{font-family:var(--f-ui);font-weight:800;fill:#1A1714;text-anchor:middle}
.cd .cd-nut{fill:#1A1714} .cd .cd-s{stroke:#4A4339;stroke-width:1.3} .cd .cd-f{stroke:#8C8478;stroke-width:1.1}
.cd .cd-dot{fill:#1A1714} .cd .cd-fn{fill:#fff;font-family:var(--f-ui);font-weight:700;text-anchor:middle}
.cd .cd-open{fill:none;stroke:#1A1714;stroke-width:1.4} .cd .cd-o{fill:#1A1714;text-anchor:middle;font-family:var(--f-ui)}
.cd.mini .cd-fn{display:none}
/* 指板 */
.fbwrap{margin:8px 0;overflow:hidden} .fb{display:block;max-width:100%;height:auto}
.fb .fb-wood{fill:#E9D3B0} .fb .fb-nut{stroke:#2A251F;stroke-width:5} .fb .fb-fret{stroke:#9A8F80;stroke-width:2}
.fb .fb-str{stroke:#5A5348} .fb .fb-num,.fb .fb-sn{font:700 12px var(--f-ui);fill:#6B6156;text-anchor:middle} .fb .fb-inlay{fill:#CDB28C}
.fb .fb-dot{fill:transparent} .fb .fb-dot.tgt{fill:#FF9F0A;stroke:#C77700;stroke-width:2} .fb .fb-dot.okk{fill:#34C759;stroke:#1E8E3E;stroke-width:2} .fb .fb-dot.wrong{fill:#FF3B30;stroke:#B3261E;stroke-width:2}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.9em;color:var(--muted);margin:2px 0 8px}
.legend i{display:inline-block;width:16px;height:16px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.lg-t{background:#FF9F0A} .lg-ok{background:#34C759} .lg-bad{background:#FF3B30}
.opts{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin:8px 0}
.result{background:var(--card);border:3px solid var(--accent);border-radius:18px;padding:18px;margin:12px 0;text-align:center}
.result .big{font-family:var(--f-head);font-size:3.2em;font-weight:700;line-height:1} .result .big small{font-size:.35em;margin-left:4px}
.result .stars{font-size:2em;margin:4px 0} .result p{margin:.4rem 0} .praise{font-weight:700}
.recs{display:grid;gap:10px}
.rec{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px}
.rec:first-child{border-top:0;padding-top:0} .rt{display:flex;flex-direction:column} .ra{display:flex;gap:6px;flex-wrap:wrap}
.quizlist{display:grid;gap:10px} @media (min-width:700px){.quizlist{grid-template-columns:1fr 1fr}}
.qz{display:flex;flex-direction:column;gap:2px;padding:14px;border:2px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink)}
.lessons{padding-left:1.5rem;margin:0} .lessons li{margin:10px 0} .lessons a{text-decoration:none;font-weight:700}
.lesson p{margin:.6rem 0} .lchords{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
.lc{display:flex;flex-direction:column;align-items:center;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:6px}
.pager{display:flex;justify-content:space-between;gap:10px;margin:10px 0}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:1.05em}
.qshow{display:flex;justify-content:center;background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:10px;margin:10px auto;max-width:360px}
.qfb{text-align:center;font-size:1.1em;min-height:3em;margin:8px 0} .qfb.good{color:var(--ok);font-weight:700} .qfb.badq{color:var(--bad)}
.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:560px;margin:0 auto}
.answers button{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:68px;border:2px solid var(--line);border-radius:14px;background:var(--card)}
.answers b{font-size:1.5em} .answers span{font-size:.8em;color:var(--muted)}
.answers.chordans{grid-template-columns:repeat(2,1fr)}
.answers .right{background:var(--ok-soft);border-color:var(--ok)} .answers .wrongb{background:var(--bad-soft);border-color:var(--bad)}
.tuner-strings button{flex-direction:column;line-height:1.25;padding:6px 0;font-size:.95em}
.tuner-strings button b{font-size:1.25em} .tuner-strings button.on{outline:3px solid var(--tgt)} .tuner-strings button.done{background:var(--ok-soft);color:var(--ok)}
.tuner-card{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:20px;margin:12px 0;text-align:center}
.tuner-card.ok{border-color:var(--ok)}
.t-string{font-size:1.2em;color:var(--muted)} .t-note{font-family:var(--f-head);font-size:3.4em;font-weight:700;line-height:1.1}
.gauge{margin:14px 0} .g-scale{display:flex;justify-content:space-between;font-size:.85em;color:var(--muted)}
.g-bar{position:relative;height:26px;background:linear-gradient(90deg,var(--bad-soft),var(--ok-soft) 44%,var(--ok-soft) 56%,var(--bad-soft));border-radius:13px}
.g-mid{position:absolute;left:50%;top:-4px;bottom:-4px;width:3px;background:var(--ok);transform:translateX(-50%)}
.g-needle{position:absolute;left:50%;top:-6px;width:8px;height:38px;border-radius:4px;background:var(--ink);transform:translateX(-50%);transition:left .12s}
.t-hint{font-size:1.4em;font-weight:700;min-height:1.6em} .tuner-card.ok .t-hint{color:var(--ok)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:2px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{flex:1;max-width:190px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;text-decoration:none;color:var(--muted);font-size:.9em;font-weight:700}
.tabbar a svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar a.on{color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#update{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:40;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:10px 18px;font-weight:700}
#michelp{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px} #michelp[hidden]{display:none}
.mh-card{background:var(--card);color:var(--ink);border-radius:18px;padding:20px;max-width:520px;width:100%}
.mh-card h2{font-size:1.2em;margin-bottom:6px} .mh-card li{margin:8px 0} .mh-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
